<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Registration Form</title>
</head>
<body>
	<h1>Registration Form</h1>
	<form action=# method="post" >
		<div>
			<label for=FirstName>First Name: * </label>
			<input type="text" name="first_name">
			
		</div><br>
		<div>
			<label for=LastName>Last Name: * </label>
			<input type="text" name="last_name">
		</div><br>
		<div>
			<label for=EmailAddress>Email Address: *</label>
			<input type="text" name="Email">
		</div><br>
		<div>
			<label for=password>password: *</label>
			<input type="password" name="password">
		</div><br>
		<div>
			<label for=Cpassword>Confirm password: *</label>
			<input type="password" name="Cpassword">
		</div>															<br>
		<div>
			<label for=birthday>Birthday</label>
			<input type="date" name="birthday">
		</div><br>
		<div>
			<h4>Gender Identity:</h4>
			<input type="radio" name="Male">
			<label for=Male>Male</label>
			<input type="radio" name="Female">
			<label for=Female>Female</label>
			<input type="radio" name="Non-binary">
			<label for=Non-binary>Non-binary</label>
			<input type="radio" name="Ipna">
			<label for=Ipna>I prefer not to answer</label>
		</div><br>
		<div>
			<h4>A show description about myself:</h4>
			<textarea name="description" cols="20"  rows="3"></textarea>
		</div><br>
		<div>
			<label for=Language>Favorite Language</label>
			<select name="Language">
    				<option>JavaScript</option>
    				<option>HTML</option>
    				<option>CSS</option>
			</select>

		</div><br>

		<div>
			<input type="checkbox" name="EmailUpdates" id="updates">
			<label for=EmailUpdates>Yes, I would like to receive periodic email updates</label>
		</div><br>
		<div>
			<input type="submit" value="Create Account" />
		</div>

	</form>

	<h4>*Indicates a required field</h4>

</body>
</html>
